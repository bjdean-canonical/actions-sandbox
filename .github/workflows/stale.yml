name: Alert on stale pull requests

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-pr-stale: 30
          days-before-close: -1
          days-before-pr-close: -1
          stale-pr-label: stale
          remove-pr-stale-when-updated: true
          # Customize this comment; add @USERNAME or @ORGANIZATION/TEAM-SLUG
          # mentions in its text to notify specific recipients.
          stale-pr-message: |
            This pull request has had no activity for 30 days. Please review it
            and provide an update when you can. It will not be closed automatically.
          # No built-in participant discovery or age-based escalation is available.
          # Optional filters; uncomment and replace with your repository's values:
          # exempt-pr-labels: 'on-hold,blocked'
          # exempt-draft-pr: true
          # operations-per-run: 100
