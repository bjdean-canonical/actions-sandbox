name: Alert on stale pull requests

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 2
          days-before-close: -1
          stale-pr-label: stale
          stale-issue-label: stale
          remove-stale-when-updated: true
          # Customize this comment; add @USERNAME or @ORGANIZATION/TEAM-SLUG
          # mentions in its text to notify specific recipients, for example:
          #   Please review this PR, @your-org/your-team.
          stale-pr-message: |
            This pull request has had no activity for TOO LONG! Please review it
            and provide an update when you can. It will not be closed automatically.
          stale-issue-message: |
            This Issue has had no activity for TOO LONG! Please review it
            and provide an update when you can. It will not be closed automatically.
          # Example manual escalation table (not executed by the action):
          # PR idle for 30 days: review team     @your-org/your-team
          # PR idle for 60 days: team lead       @your-org/your-leads
          # PR idle for 90 days: manager         @your-manager
          # Replace these examples; timed escalation requires separate automation.
          # Optional filters; uncomment and replace with your repository's values:
          # exempt-pr-labels: 'on-hold,blocked'
          # exempt-draft-pr: true
          # operations-per-run: 100
